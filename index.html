<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steve's Daily Briefings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#020d05; color:#e2f5e8; min-height:100vh; padding:30px 16px; }
  .container { max-width:700px; margin:0 auto; }
  h1 { color:#4ade80; font-size:1.6rem; margin-bottom:4px; }
  .subtitle { color:#9ca3af; font-size:0.85rem; margin-bottom:24px; }
  .latest-btn { display:inline-block; background:rgba(74,222,128,0.15); border:2px solid #4ade80; color:#4ade80; border-radius:12px; padding:10px 22px; font-weight:700; font-size:0.9rem; text-decoration:none; margin-bottom:28px; transition:background 0.2s; }
  .latest-btn:hover { background:rgba(74,222,128,0.3); }
  .search-box { width:100%; background:rgba(8,22,13,0.7); border:1px solid rgba(251,130,100,0.4); border-radius:10px; padding:10px 16px; color:#e2f5e8; font-size:0.9rem; margin-bottom:20px; box-sizing:border-box; }
  .briefing-list { list-style:none; padding:0; }
  .briefing-item { background:rgba(8,22,13,0.7); border:1px solid rgba(251,130,100,0.3); border-radius:12px; padding:14px 18px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .briefing-date { font-weight:600; color:#e2f5e8; }
  .briefing-link { color:#fbbf24; font-size:0.85rem; text-decoration:none; }
  .briefing-link:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Steve's Daily Briefings</h1>
  <div class="subtitle">Job Coach &amp; Reskilling — Invergordon, Scottish Highlands</div>
  <a id="latest-link" href="#" class="latest-btn">📅 Open Latest Briefing</a>
  <input type="text" class="search-box" id="search" placeholder="Search briefings by date..." oninput="filterBriefings()">
  <ul class="briefing-list" id="briefing-list"></ul>
</div>
<script>
// BRIEFINGS array: [day, month, year, filename] — newest first, plain numbers
var BRIEFINGS = [
  [14, 5, 2026, "Daily-Briefing_14-05-2026.html"]
];

function pad(n){ return String(n).padStart(2,'0'); }
function renderBriefings(list){
  var ul = document.getElementById("briefing-list");
  ul.innerHTML = "";
  list.forEach(function(b){
    var d = b[0], m = b[1], y = b[2], fname = b[3];
    var dateStr = pad(d)+"/"+pad(m)+"/"+y;
    var li = document.createElement("li");
    li.className = "briefing-item";
    li.innerHTML = "<span class='briefing-date'>"+dateStr+"</span><a class='briefing-link' href='"+fname+"'>Open Briefing &rarr;</a>";
    ul.appendChild(li);
  });
}
function filterBriefings(){
  var q = document.getElementById("search").value.toLowerCase();
  var filtered = BRIEFINGS.filter(function(b){ return (pad(b[0])+"/"+pad(b[1])+"/"+b[2]).includes(q); });
  renderBriefings(filtered);
}
// Sort newest first by date
BRIEFINGS.sort(function(a,b){ var da=new Date(a[2],a[1]-1,a[0]), db=new Date(b[2],b[1]-1,b[0]); return db-da; });
// Set latest link
if(BRIEFINGS.length>0){ document.getElementById("latest-link").href = BRIEFINGS[0][3]; }
renderBriefings(BRIEFINGS);
</script>
</body>
</html>
